name: Regulatory Monitor

on:
  schedule:
    # Daily at 10:00 UTC
    - cron: '0 10 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/regulatory_monitor.py'
      - 'scripts/monitoring_shared.py'
      - 'scripts/test_monitoring_shared_fetch_page.py'
      - 'scripts/config/monitoring-config.yaml'
      - 'scripts/test_regulatory_monitor.py'
      - 'scripts/test_regulatory_monitoring_workflow.py'
      - 'scripts/regulatory_monitor_cleanup.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/regulatory-monitoring.yml'

# Serialize same-workflow runs so cleanup of prior PRs doesn't race a
# concurrent run that just opened a newer PR (see #48).
concurrency:
  group: regulatory-monitor
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt pytest

      - name: Run regulatory monitor tests (classifier + config regression)
        run: python -m pytest scripts/test_regulatory_monitor.py scripts/test_regulatory_monitoring_workflow.py scripts/test_monitoring_shared_fetch_page.py -v

      - name: Run Regulatory Monitor (PR smoke, dry-run)
        run: python scripts/regulatory_monitor.py --dry-run

  monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write  # required for `gh pr comment` (PR comments are issue comments)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt pytest

      - name: Run Regulatory Monitor (scheduled / manual)
        id: monitor
        run: |
          set +e
          python scripts/regulatory_monitor.py
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Contract: 0 = clean, 3 = findings, 4 = degraded partial run,
          # 2 = source/execution failure.
          # Any other non-zero code is also a failure, including Python's
          # default exit code 1 for an uncaught exception.
          case "$EXIT_CODE" in
            0)
              exit 0
              ;;
            3)
              REPORT_FILE=$(ls -t reports/monitoring/regulatory-changes-*.md 2>/dev/null | head -1) || true
              if [ -z "$REPORT_FILE" ]; then
                echo "::error::Regulatory Monitor reported findings but produced no report"
                exit 2
              fi
              echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
              NEW_ITEMS=$(grep -m1 '^\*\*New Items:\*\*' "$REPORT_FILE" | sed 's/^\*\*New Items:\*\* //') || true
              FINRA_DISCOVERY_PATH=$(grep -m1 '^\*\*FINRA Discovery Path:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Discovery Path:\*\* //') || true
              FINRA_VALIDATOR_DROPPED=$(grep -m1 '^\*\*FINRA Validator Dropped:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Validator Dropped:\*\* //') || true
              FINRA_NEW_FETCHED=$(grep -m1 '^\*\*FINRA New Notices Fetched:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA New Notices Fetched:\*\* //') || true
              FINRA_LISTING_CROSS_CHECK=$(grep -m1 '^\*\*FINRA Listing Cross-Check:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Listing Cross-Check:\*\* //') || true
              FINRA_VERIFICATION_STATE=$(grep -m1 '^\*\*FINRA Verification State:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Verification State:\*\* //') || true
              echo "new_items=${NEW_ITEMS:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_discovery_path=${FINRA_DISCOVERY_PATH:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_validator_dropped=${FINRA_VALIDATOR_DROPPED:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_new_notices_fetched=${FINRA_NEW_FETCHED:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_listing_cross_check=${FINRA_LISTING_CROSS_CHECK:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_verification_state=${FINRA_VERIFICATION_STATE:-not reported}" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            4)
              REPORT_FILE=$(ls -t reports/monitoring/regulatory-changes-*.md 2>/dev/null | head -1) || true
              if [ -z "$REPORT_FILE" ]; then
                echo "::error::Regulatory Monitor reported a degraded run but produced no report"
                exit 2
              fi
              echo "::warning::Regulatory Monitor completed with degraded source availability or escalated source verification"
              echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
              NEW_ITEMS=$(grep -m1 '^\*\*New Items:\*\*' "$REPORT_FILE" | sed 's/^\*\*New Items:\*\* //') || true
              DEGRADED_SOURCES=$(grep -m1 '^\*\*Degraded Sources:\*\*' "$REPORT_FILE" | sed 's/^\*\*Degraded Sources:\*\* //') || true
              ESCALATED_SOURCES=$(grep -m1 '^\*\*Escalated Sources:\*\*' "$REPORT_FILE" | sed 's/^\*\*Escalated Sources:\*\* //') || true
              echo "new_items=${NEW_ITEMS:-not reported}" >> "$GITHUB_OUTPUT"
              echo "degraded_sources=${DEGRADED_SOURCES:-}" >> "$GITHUB_OUTPUT"
              echo "escalated_sources=${ESCALATED_SOURCES:-}" >> "$GITHUB_OUTPUT"
              FINRA_DISCOVERY_PATH=$(grep -m1 '^\*\*FINRA Discovery Path:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Discovery Path:\*\* //') || true
              FINRA_VALIDATOR_DROPPED=$(grep -m1 '^\*\*FINRA Validator Dropped:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Validator Dropped:\*\* //') || true
              FINRA_NEW_FETCHED=$(grep -m1 '^\*\*FINRA New Notices Fetched:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA New Notices Fetched:\*\* //') || true
              FINRA_LISTING_CROSS_CHECK=$(grep -m1 '^\*\*FINRA Listing Cross-Check:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Listing Cross-Check:\*\* //') || true
              FINRA_VERIFICATION_STATE=$(grep -m1 '^\*\*FINRA Verification State:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Verification State:\*\* //') || true
              echo "finra_discovery_path=${FINRA_DISCOVERY_PATH:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_validator_dropped=${FINRA_VALIDATOR_DROPPED:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_new_notices_fetched=${FINRA_NEW_FETCHED:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_listing_cross_check=${FINRA_LISTING_CROSS_CHECK:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_verification_state=${FINRA_VERIFICATION_STATE:-not reported}" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            2)
              echo "::error::Regulatory Monitor source/execution failure"
              exit "$EXIT_CODE"
              ;;
            *)
              echo "::error::Regulatory Monitor failed with unexpected exit code $EXIT_CODE"
              exit "$EXIT_CODE"
              ;;
          esac

      - name: Detect state changes
        id: diff
        if: steps.monitor.outputs.exit_code == '3' || steps.monitor.outputs.exit_code == '4'
        run: |
          if [ -n "$(git status --porcelain data/monitor-state.json reports/monitoring/ 2>/dev/null)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Regulatory Monitor PR metadata
        id: pr-meta
        if: steps.monitor.outputs.exit_code == '3' || steps.monitor.outputs.exit_code == '4'
        run: |
          new_items="${{ steps.monitor.outputs.new_items }}"
          if [ "${{ steps.monitor.outputs.exit_code }}" = "4" ]; then
            cleanup_kind=degraded
            echo "cleanup_kind=${cleanup_kind}" >> "$GITHUB_OUTPUT"
            sources="${{ steps.monitor.outputs.degraded_sources }}"
            escalated_sources="${{ steps.monitor.outputs.escalated_sources }}"
            finra_unverified=false
            if [ "${{ steps.monitor.outputs.finra_verification_state }}" = "unverified-clean" ]; then
              finra_unverified=true
            fi
            finra_escalated=false
            if $finra_unverified && echo "$escalated_sources" | grep -qi "FINRA"; then
              finra_escalated=true
            fi
            if $finra_escalated && echo "$sources" | grep -qi "Federal Register"; then
              echo "title=Regulatory Monitor: DEGRADED (FINRA cross-check + Federal Register unavailable) (run ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            elif $finra_escalated; then
              unavailable="FINRA notices page-0 cross-check"
              echo "title=Regulatory Monitor: DEGRADED (FINRA cross-check unavailable) (run ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            elif echo "$sources" | grep -qi "FINRA"; then
              unavailable="FINRA notices"
              echo "title=Regulatory Monitor: DEGRADED (FINRA unavailable) (run ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            elif echo "$sources" | grep -qi "Federal Register"; then
              unavailable="Federal Register"
              echo "title=Regulatory Monitor: DEGRADED (Federal Register unavailable) (run ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            else
              unavailable="$sources"
              echo "title=Regulatory Monitor: DEGRADED (source unavailable) (run ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            fi
            echo "extra_labels=monitor-degraded" >> "$GITHUB_OUTPUT"
            {
              echo "degraded_body<<EOF"
              if [ -n "$sources" ]; then
                echo "### Sources unavailable this run"
                echo ""
                echo "⚠️ Unavailable this run: ${sources}. This source was not checked, and its baseline was not advanced."
                echo ""
              fi
              if $finra_escalated; then
                echo "### FINRA verification escalated"
                echo ""
                echo "⚠️ FINRA notices page-0 cross-check has been unavailable for consecutive runs. FINRA RSS discovery ran, fetched/new counts are preserved, and the report remains actionable; merge this PR to persist the RSS-derived baseline and counter state."
              elif $finra_unverified; then
                echo "### FINRA verification unverified"
                echo ""
                echo "⚠️ FINRA RSS discovery ran, but the HTTPS page-0 listing cross-check was unavailable. Any findings in this PR are RSS-derived and should be reviewed as unverified until the page-0 cross-check recovers."
              fi
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            if [ "${{ steps.monitor.outputs.finra_verification_state }}" = "unverified-clean" ]; then
              if [ "$new_items" = "0" ]; then
                cleanup_kind=unverified-clean
              else
                cleanup_kind=unverified-findings
              fi
              echo "cleanup_kind=${cleanup_kind}" >> "$GITHUB_OUTPUT"
              echo "title=Regulatory Monitor: UNVERIFIED (FINRA listing cross-check unavailable) (run ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
              echo "extra_labels=monitor-unverified" >> "$GITHUB_OUTPUT"
              {
                echo "degraded_body<<EOF"
                echo "### FINRA verification unverified"
                echo ""
                echo "⚠️ FINRA RSS discovery ran, but the HTTPS page-0 listing cross-check was unavailable. Any findings in this PR are RSS-derived and should be reviewed as unverified until the page-0 cross-check recovers."
                echo ""
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
            else
              cleanup_kind=findings
              echo "cleanup_kind=${cleanup_kind}" >> "$GITHUB_OUTPUT"
              echo "title=Regulatory Monitor: findings (run ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
              echo "extra_labels=" >> "$GITHUB_OUTPUT"
              {
                echo "degraded_body<<EOF"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
            fi
          fi
          if ! python scripts/regulatory_monitor_cleanup.py emit-marker \
            --report-file "${{ steps.monitor.outputs.report_file }}" \
            --result "$cleanup_kind" \
            --new-items "$new_items" \
            >> "$GITHUB_OUTPUT"; then
            echo "::warning::Regulatory Monitor cleanup marker generation failed; opening the PR without a cleanup marker so later cleanup fails closed."
          fi

      - name: Ensure degraded monitor label exists
        if: steps.monitor.outputs.exit_code == '4' || steps.monitor.outputs.finra_verification_state == 'unverified-clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create monitor-degraded \
            --repo "$REPO" \
            --color FBCA04 \
            --description "Regulatory Monitor ran with an unavailable source" \
          || gh label edit monitor-degraded \
            --repo "$REPO" \
            --color FBCA04 \
            --description "Regulatory Monitor ran with an unavailable source"
          gh label create monitor-unverified \
            --repo "$REPO" \
            --color D29922 \
            --description "Regulatory Monitor ran without FINRA listing cross-check verification" \
          || gh label edit monitor-unverified \
            --repo "$REPO" \
            --color D29922 \
            --description "Regulatory Monitor ran without FINRA listing cross-check verification"

      - name: Generate GitHub App token
        id: app-token
        if: (steps.monitor.outputs.exit_code == '3' || steps.monitor.outputs.exit_code == '4') && steps.diff.outputs.has_changes == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open / update PR with regulatory findings
        id: cpr
        if: (steps.monitor.outputs.exit_code == '3' || steps.monitor.outputs.exit_code == '4') && steps.diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Regulatory Monitor: new findings detected"
          branch: monitoring/regulatory-${{ github.run_number }}
          delete-branch: true
          base: main
          title: "${{ steps.pr-meta.outputs.title }}"
          labels: |
            monitoring
            regulatory
            needs-review
            automated
            ${{ steps.pr-meta.outputs.extra_labels }}
          body: |
            ## Regulatory Monitor Report

            Automated daily scan of Federal Register (SEC, CFTC, OCC, Federal Reserve)
            and FINRA notices for AI- / FSI-relevant regulatory changes.

            - Report: `${{ steps.monitor.outputs.report_file }}`
            - FINRA discovery path: `${{ steps.monitor.outputs.finra_discovery_path }}`
            - FINRA validator-dropped items: `${{ steps.monitor.outputs.finra_validator_dropped }}`
            - FINRA new notices fetched: `${{ steps.monitor.outputs.finra_new_notices_fetched }}`
            - FINRA listing cross-check: `${{ steps.monitor.outputs.finra_listing_cross_check }}`
            - FINRA verification state: `${{ steps.monitor.outputs.finra_verification_state }}`
            - Monitor result: `${{ steps.pr-meta.outputs.cleanup_kind }}`
            - Monitor new items: `${{ steps.monitor.outputs.new_items }}`

            ${{ steps.pr-meta.outputs.degraded_body }}

            ### Superseded monitor PR cleanup matrix
            The newest monitor PR is not assumed to contain every older open PR's branch-only report. Automated cleanup therefore fails closed unless a workflow-owned marker proves the older PR has zero new items, or an older findings PR's item-key set is a subset of the new findings PR's item-key set. Missing, duplicate, malformed, mismatched, or truncated markers leave the older PR open.

            | New run result | Older findings PR | Older UNVERIFIED-clean PR (`0` new items) | Older UNVERIFIED PR with findings/unknown marker | Older DEGRADED-clean PR (`0` new items) | Older DEGRADED PR with findings/unknown marker |
            |---|---|---|---|---|---|
            | `verified-clean` | Leave open for review. | Close: verification recovered and no findings are dropped. | Leave open for review. | Close: verification recovered and no findings are dropped. | Leave open for review. |
            | `findings` | Close only when older item keys are a subset of the new item keys. | Close: no findings are dropped. | Leave open for review. | Close: sources recovered and no findings are dropped. | Leave open for review. |
            | `unverified-clean` | Leave open for review. | Close: no findings are dropped. | Leave open for review. | Leave open; unverified runs must not close degraded PRs. | Leave open for review. |
            | `unverified-findings` | Leave open for review. | Close: no findings are dropped. | Leave open for review. | Leave open; unverified runs must not close degraded PRs. | Leave open for review. |
            | `degraded` | Leave open for review. | Close: no findings are dropped. | Leave open for review. | Close: same degraded monitor stream and no findings are dropped. | Leave open for review. |

            ### Classification tiers
            - 🔴 **CRITICAL** — Directly mentions AI agents, copilot, or automated advice
            - 🟠 **HIGH** — References AI/ML/automation or FSI-specific requirements; SRO rule-filing boilerplate is suppressed unless AI governance or supervision evidence is present
            - 🟡 **MEDIUM** — General FSI regulations (indirect AI impact)
            - ⚪ **NOISE** — No FSI governance relevance

            ### Review instructions
            1. Open the report for CRITICAL/HIGH items and affected-control keywords.
            2. Update controls/playbooks where a regulatory change requires it.
            3. Merge to update the monitoring baseline.

            ---
            *Automated PR created by `.github/workflows/regulatory-monitoring.yml`.*

            ${{ steps.pr-meta.outputs.cleanup_marker }}

      - name: Close prior superseded Regulatory Monitor PRs
        if: steps.monitor.outputs.exit_code == '0' || ((steps.monitor.outputs.exit_code == '3' || steps.monitor.outputs.exit_code == '4') && steps.cpr.outputs.pull-request-number != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NEW_PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          # Identify our own monitor PRs by multiple invariants — labels alone
          # are too broad (humans can edit them). See issue #48.
          #
          # Cleanup matrix (issue #550 N9):
          # | New result | Older findings | Older UNVERIFIED-clean (0 new items) | Older UNVERIFIED with findings/unknown | Older DEGRADED-clean (0 new items) | Older DEGRADED with findings/unknown |
          # | verified-clean | leave open | close | leave open | close | leave open |
          # | findings | close only when old item keys are a subset of new item keys | close | leave open | close | leave open |
          # | unverified-clean | leave open | close | leave open | leave open | leave open |
          # | unverified-findings | leave open | close | leave open | leave open | leave open |
          # | degraded | leave open | close | leave open | close | leave open |
          #
          # A newer branch is based on current main, not on older open PR
          # branches, so branch-only older reports are not inherently
          # cumulative. The selector fails closed unless the older PR body
          # has a workflow-owned marker proving it had 0 new items, or an
          # older findings PR's item-key set is a subset of this run's item
          # keys. Missing, duplicate, malformed, mismatched, or truncated
          # markers leave the older PR open.
          pr_limit=200
          prior_json="$(gh pr list \
            --repo "$REPO" \
            --state open \
            --label regulatory \
            --label automated \
            --base main \
            --limit "$pr_limit" \
            --json number,headRefName,author,title,labels,body)"
          prior_count="$(printf '%s' "$prior_json" | python -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          if [ "$prior_count" -ge "$pr_limit" ]; then
            echo "::warning::Regulatory Monitor cleanup saw ${prior_count} open PRs, matching the listing limit; older PRs may remain for a future run."
          fi
          new_result="${{ steps.pr-meta.outputs.cleanup_kind }}"
          superseding_ref="#${NEW_PR}"
          new_report_args=()
          new_pr_args=()
          if [ -n "$NEW_PR" ]; then
            new_pr_args=(--new-pr "$NEW_PR")
          fi
          if [ "${{ steps.monitor.outputs.exit_code }}" = "0" ]; then
            new_result="verified-clean"
            superseding_ref="verified clean run ${{ github.run_number }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            new_report_args=(--new-report-file "${{ steps.monitor.outputs.report_file }}")
          fi
          selection_file="$(mktemp)"
          trap 'rm -f "$selection_file"' EXIT
          printf '%s' "$prior_json" | python scripts/regulatory_monitor_cleanup.py \
            select \
            "${new_pr_args[@]}" \
            --new-result "$new_result" \
            "${new_report_args[@]}" \
            > "$selection_file"
          mapfile -t prior < "$selection_file"
          rm -f "$selection_file"
          trap - EXIT

          if [ "${#prior[@]}" -eq 0 ]; then
            echo "No prior Regulatory Monitor PRs to supersede."
            exit 0
          fi

          echo "Superseding ${#prior[@]} prior Regulatory Monitor PR(s) with #${NEW_PR}..."
          for row in "${prior[@]}"; do
            IFS=$'\t' read -r n reason <<< "$row"
            [ -z "$n" ] && continue
            if ! gh pr comment "$n" --repo "$REPO" --body "Superseded by ${superseding_ref} under the Regulatory Monitor cleanup matrix (${reason}). The matrix is documented in the workflow/PR body and only auto-closes older PRs that are safe to supersede without dropping unreviewed findings."; then
              echo "::warning::Failed to comment on PR #${n}"
            fi
            # Close without --delete-branch so dated reports stay reachable
            # for any future consolidation cleanup.
            if ! gh pr close "$n" --repo "$REPO"; then
              echo "::warning::Failed to close PR #${n}"
            fi
          done
