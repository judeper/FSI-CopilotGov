name: Regulatory Monitor

on:
  schedule:
    # Daily at 10:00 UTC
    - cron: '0 10 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/regulatory_monitor.py'
      - 'scripts/monitoring_shared.py'
      - 'scripts/test_monitoring_shared_fetch_page.py'
      - 'scripts/config/monitoring-config.yaml'
      - 'scripts/test_regulatory_monitor.py'
      - 'scripts/test_regulatory_monitoring_workflow.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/regulatory-monitoring.yml'

# Serialize same-workflow runs so cleanup of prior PRs doesn't race a
# concurrent run that just opened a newer PR (see #48).
concurrency:
  group: regulatory-monitor
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt pytest

      - name: Run regulatory monitor tests (classifier + config regression)
        run: python -m pytest scripts/test_regulatory_monitor.py scripts/test_regulatory_monitoring_workflow.py scripts/test_monitoring_shared_fetch_page.py -v

      - name: Run Regulatory Monitor (PR smoke, dry-run)
        run: python scripts/regulatory_monitor.py --dry-run

  monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write  # required for `gh pr comment` (PR comments are issue comments)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt pytest

      - name: Run Regulatory Monitor (scheduled / manual)
        id: monitor
        run: |
          set +e
          python scripts/regulatory_monitor.py
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Contract: 0 = clean, 3 = findings, 4 = degraded partial run,
          # 2 = source/execution failure.
          # Any other non-zero code is also a failure, including Python's
          # default exit code 1 for an uncaught exception.
          case "$EXIT_CODE" in
            0)
              exit 0
              ;;
            3)
              REPORT_FILE=$(ls -t reports/monitoring/regulatory-changes-*.md 2>/dev/null | head -1) || true
              if [ -z "$REPORT_FILE" ]; then
                echo "::error::Regulatory Monitor reported findings but produced no report"
                exit 2
              fi
              echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
              FINRA_DISCOVERY_PATH=$(grep -m1 '^\*\*FINRA Discovery Path:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Discovery Path:\*\* //') || true
              FINRA_VALIDATOR_DROPPED=$(grep -m1 '^\*\*FINRA Validator Dropped:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Validator Dropped:\*\* //') || true
              FINRA_NEW_FETCHED=$(grep -m1 '^\*\*FINRA New Notices Fetched:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA New Notices Fetched:\*\* //') || true
              FINRA_LISTING_CROSS_CHECK=$(grep -m1 '^\*\*FINRA Listing Cross-Check:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Listing Cross-Check:\*\* //') || true
              FINRA_VERIFICATION_STATE=$(grep -m1 '^\*\*FINRA Verification State:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Verification State:\*\* //') || true
              echo "finra_discovery_path=${FINRA_DISCOVERY_PATH:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_validator_dropped=${FINRA_VALIDATOR_DROPPED:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_new_notices_fetched=${FINRA_NEW_FETCHED:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_listing_cross_check=${FINRA_LISTING_CROSS_CHECK:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_verification_state=${FINRA_VERIFICATION_STATE:-verified}" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            4)
              REPORT_FILE=$(ls -t reports/monitoring/regulatory-changes-*.md 2>/dev/null | head -1) || true
              if [ -z "$REPORT_FILE" ]; then
                echo "::error::Regulatory Monitor reported a degraded run but produced no report"
                exit 2
              fi
              echo "::warning::Regulatory Monitor completed with degraded source availability"
              echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
              DEGRADED_SOURCES=$(grep -m1 '^\*\*Degraded Sources:\*\*' "$REPORT_FILE" | sed 's/^\*\*Degraded Sources:\*\* //') || true
              echo "degraded_sources=${DEGRADED_SOURCES:-source unavailable}" >> "$GITHUB_OUTPUT"
              FINRA_DISCOVERY_PATH=$(grep -m1 '^\*\*FINRA Discovery Path:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Discovery Path:\*\* //') || true
              FINRA_VALIDATOR_DROPPED=$(grep -m1 '^\*\*FINRA Validator Dropped:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Validator Dropped:\*\* //') || true
              FINRA_NEW_FETCHED=$(grep -m1 '^\*\*FINRA New Notices Fetched:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA New Notices Fetched:\*\* //') || true
              FINRA_LISTING_CROSS_CHECK=$(grep -m1 '^\*\*FINRA Listing Cross-Check:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Listing Cross-Check:\*\* //') || true
              FINRA_VERIFICATION_STATE=$(grep -m1 '^\*\*FINRA Verification State:\*\*' "$REPORT_FILE" | sed 's/^\*\*FINRA Verification State:\*\* //') || true
              echo "finra_discovery_path=${FINRA_DISCOVERY_PATH:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_validator_dropped=${FINRA_VALIDATOR_DROPPED:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_new_notices_fetched=${FINRA_NEW_FETCHED:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_listing_cross_check=${FINRA_LISTING_CROSS_CHECK:-not reported}" >> "$GITHUB_OUTPUT"
              echo "finra_verification_state=${FINRA_VERIFICATION_STATE:-verified}" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            2)
              echo "::error::Regulatory Monitor source/execution failure"
              exit "$EXIT_CODE"
              ;;
            *)
              echo "::error::Regulatory Monitor failed with unexpected exit code $EXIT_CODE"
              exit "$EXIT_CODE"
              ;;
          esac

      - name: Detect state changes
        id: diff
        if: steps.monitor.outputs.exit_code == '3' || steps.monitor.outputs.exit_code == '4'
        run: |
          if [ -n "$(git status --porcelain data/monitor-state.json reports/monitoring/ 2>/dev/null)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Regulatory Monitor PR metadata
        id: pr-meta
        if: steps.monitor.outputs.exit_code == '3' || steps.monitor.outputs.exit_code == '4'
        run: |
          if [ "${{ steps.monitor.outputs.exit_code }}" = "4" ]; then
            sources="${{ steps.monitor.outputs.degraded_sources }}"
            if echo "$sources" | grep -qi "FINRA"; then
              unavailable="FINRA notices"
              echo "title=Regulatory Monitor: DEGRADED (FINRA unavailable) (run ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            elif echo "$sources" | grep -qi "Federal Register"; then
              unavailable="Federal Register"
              echo "title=Regulatory Monitor: DEGRADED (Federal Register unavailable) (run ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            else
              unavailable="$sources"
              echo "title=Regulatory Monitor: DEGRADED (source unavailable) (run ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            fi
            echo "extra_labels=monitor-degraded" >> "$GITHUB_OUTPUT"
            {
              echo "degraded_body<<EOF"
              echo "### Sources unavailable this run"
              echo ""
              echo "⚠️ Unavailable this run: ${unavailable}. This source was not checked, and its baseline was not advanced."
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "title=Regulatory Monitor: findings (run ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            echo "extra_labels=" >> "$GITHUB_OUTPUT"
            {
              echo "degraded_body<<EOF"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure degraded monitor label exists
        if: steps.monitor.outputs.exit_code == '4'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create monitor-degraded \
            --repo "$REPO" \
            --color FBCA04 \
            --description "Regulatory Monitor ran with an unavailable source" \
          || gh label edit monitor-degraded \
            --repo "$REPO" \
            --color FBCA04 \
            --description "Regulatory Monitor ran with an unavailable source"

      - name: Generate GitHub App token
        id: app-token
        if: (steps.monitor.outputs.exit_code == '3' || steps.monitor.outputs.exit_code == '4') && steps.diff.outputs.has_changes == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open / update PR with regulatory findings
        id: cpr
        if: (steps.monitor.outputs.exit_code == '3' || steps.monitor.outputs.exit_code == '4') && steps.diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Regulatory Monitor: new findings detected"
          branch: monitoring/regulatory-${{ github.run_number }}
          delete-branch: true
          base: main
          title: "${{ steps.pr-meta.outputs.title }}"
          labels: |
            monitoring
            regulatory
            needs-review
            automated
            ${{ steps.pr-meta.outputs.extra_labels }}
          body: |
            ## Regulatory Monitor Report

            Automated daily scan of Federal Register (SEC, CFTC, OCC, Federal Reserve)
            and FINRA notices for AI- / FSI-relevant regulatory changes.

            - Report: `${{ steps.monitor.outputs.report_file }}`
            - FINRA discovery path: `${{ steps.monitor.outputs.finra_discovery_path }}`
            - FINRA validator-dropped items: `${{ steps.monitor.outputs.finra_validator_dropped }}`
            - FINRA new notices fetched: `${{ steps.monitor.outputs.finra_new_notices_fetched }}`
            - FINRA listing cross-check: `${{ steps.monitor.outputs.finra_listing_cross_check }}`
            - FINRA verification state: `${{ steps.monitor.outputs.finra_verification_state }}`

            ${{ steps.pr-meta.outputs.degraded_body }}

            ### Classification tiers
            - 🔴 **CRITICAL** — Directly mentions AI agents, copilot, or automated advice
            - 🟠 **HIGH** — References AI/ML/automation or FSI-specific requirements
            - 🟡 **MEDIUM** — General FSI regulations (indirect AI impact)
            - ⚪ **NOISE** — No FSI governance relevance

            ### Review instructions
            1. Open the report for CRITICAL/HIGH items and affected-control keywords.
            2. Update controls/playbooks where a regulatory change requires it.
            3. Merge to update the monitoring baseline.

            ---
            *Automated PR created by `.github/workflows/regulatory-monitoring.yml`.*

      - name: Close prior superseded Regulatory Monitor PRs
        if: (steps.monitor.outputs.exit_code == '3' || steps.monitor.outputs.exit_code == '4') && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NEW_PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -uo pipefail
          # Identify our own monitor PRs by multiple invariants — labels alone
          # are too broad (humans can edit them). See issue #48.
          # steps.monitor.outputs.exit_code == '4' restricts degraded cleanup to older degraded PRs.
          mapfile -t prior < <(gh pr list \
            --repo "$REPO" \
            --state open \
            --label regulatory \
            --label automated \
            --base main \
            --json number,headRefName,author,title,labels \
            --jq ".[] |
              select(.number < ($NEW_PR | tonumber)) |
              select(.headRefName | startswith(\"monitoring/regulatory-\")) |
              select(.author.login == \"app/fsi-monitor-bot\") |
              select(.title | startswith(\"Regulatory Monitor:\")) |
              select(if \"${{ steps.monitor.outputs.exit_code }}\" == \"4\" then any(.labels[]?.name; . == \"monitor-degraded\") else true end) |
              .number")

          if [ "${#prior[@]}" -eq 0 ]; then
            echo "No prior Regulatory Monitor PRs to supersede."
            exit 0
          fi

          echo "Superseding ${#prior[@]} prior Regulatory Monitor PR(s) with #${NEW_PR}..."
          for n in "${prior[@]}"; do
            [ -z "$n" ] && continue
            if ! gh pr comment "$n" --repo "$REPO" --body "Superseded by #${NEW_PR}. The dated report file remains reachable on this PR's branch until cleanup."; then
              echo "::warning::Failed to comment on PR #${n}"
            fi
            # Close without --delete-branch so dated reports stay reachable
            # for any future consolidation cleanup.
            if ! gh pr close "$n" --repo "$REPO"; then
              echo "::warning::Failed to close PR #${n}"
            fi
          done
